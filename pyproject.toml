[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "viterbox"
version = "1.0.0"
description = "Vietnamese Text-to-Speech based on Chatterbox"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "CC-BY-NC-4.0"}
authors = [
    {name = "Dolly VN - ContextBoxAI"}
]
keywords = ["tts", "text-to-speech", "vietnamese", "voice-cloning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "numpy>=1.26.4,<2",
    "librosa==0.11.0",
    "s3tokenizer",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "transformers==4.46.3",
    "diffusers==0.29.0",
    "resemble-perth==1.0.1",
    "conformer==0.3.2",
    "safetensors==0.5.3",
    "spacy-pkuseg",
    "pykakasi==2.3.0",
    "gradio==5.44.1",
    "soe-vinorm>=0.3.2",
    "huggingface_hub>=0.20.0",
    "einops>=0.7.0",
    "soundfile>=0.12.0",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "asyncpg>=0.32.0",
    "alembic>=1.20.0",
    "pydantic-settings>=2.15.0",
    "passlib>=1.7.4",
    "firebase-admin>=7.7.0",
    "pydantic[email]>=2.11.10",
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
    "aiofiles>=24.1.0",
    "runwayml>=5.21.0",
    "edge-tts>=7.2.8",
    "omegaconf>=2.4.0",
    "onnx>=1.19.0",
    "ml-dtypes>=0.5.0",
    "fastapi-mail>=1.5.2",
]

[project.optional-dependencies]
ui = ["gradio>=4.0.0"]

[project.scripts]
viterbox = "inference:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["viterbox*"]
